<?xml version="1.0" encoding="utf-8"?>
<!-- Simple animated demo: Create → Seal → Reveal -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240">
  <style>
    .bg { fill: #0f172a }
    .card { fill: #0b1220; stroke: #1f2937; stroke-width: 1; rx: 10 }
    .title { fill: #fff; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 600 }
    .muted { fill: #94a3b8; font-size: 14px }
    .big { font-size: 28px }
  </style>

  <rect class="bg" width="100%" height="100%" rx="8"/>

  <g transform="translate(40,32)">
    <rect class="card" width="560" height="176" rx="12"/>

    <text class="title big" x="28" y="48">Create → Seal → Reveal</text>
    <text class="muted" x="28" y="78">A quick demo: create a capsule, watch it seal, open on reveal day.</text>

    <!-- Create step -->
    <g id="create" transform="translate(28,96)">
      <rect width="120" height="40" rx="6" fill="#1f2937"/>
      <text x="60" y="26" font-size="14" fill="#a3e635" text-anchor="middle">Create</text>
    </g>

    <!-- Seal step (lock) -->
    <g id="seal" transform="translate(220,96)">
      <rect width="120" height="40" rx="6" fill="#1f2937"/>
      <text x="60" y="26" font-size="14" fill="#f97316" text-anchor="middle">Seal</text>
      <g id="lock" transform="translate(40,6)">
        <rect x="8" y="12" width="44" height="20" rx="3" fill="#111827" />
        <path d="M20 12V8a8 8 0 0116 0v4" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Reveal step -->
    <g id="reveal" transform="translate(412,96)">
      <rect width="120" height="40" rx="6" fill="#1f2937"/>
      <text x="60" y="26" font-size="14" fill="#60a5fa" text-anchor="middle">Reveal</text>
      <g id="open" transform="translate(48,8)">
        <path d="M10 12c6 5 16 8 28 8" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Animated connectors -->
    <path id="c1" d="M148 116 L220 116" stroke="#374151" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke" values="#374151;#6ee7b7;#374151" dur="3s" repeatCount="indefinite" begin="0s" />
    </path>
    <path id="c2" d="M340 116 L412 116" stroke="#374151" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke" values="#374151;#fda4af;#374151" dur="3s" repeatCount="indefinite" begin="1s" />
    </path>

    <!-- Pulses on steps -->
    <circle cx="88" cy="116" r="6" fill="#65a30d">
      <animate attributeName="r" values="6;14;6" dur="3s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" begin="0s" />
    </circle>
    <circle cx="280" cy="116" r="6" fill="#fb923c">
      <animate attributeName="r" values="6;14;6" dur="3s" repeatCount="indefinite" begin="0.8s" />
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" begin="0.8s" />
    </circle>
    <circle cx="472" cy="116" r="6" fill="#38bdf8">
      <animate attributeName="r" values="6;14;6" dur="3s" repeatCount="indefinite" begin="1.6s" />
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" begin="1.6s" />
    </circle>
  </g>
</svg>